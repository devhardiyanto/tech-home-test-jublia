<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pokédex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Inlined on purpose: the splash must paint before any stylesheet or
       script arrives, otherwise there is nothing to look at while Angular boots. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 18px;
      background: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.35s ease;
    }

    /* Added once Angular has bootstrapped; the node is removed after the fade. */
    #app-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-ball {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      /* Red top half, white bottom half, dark band across the middle. */
      background:
        linear-gradient(#ee1c25 0 48%, #2b2b2b 48% 56%, #f5f5f5 56% 100%);
      border: 3px solid #2b2b2b;
      position: relative;
      animation: splash-bob 1.1s ease-in-out infinite;
    }

    .splash-ball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff;
      border: 3px solid #2b2b2b;
    }

    .splash-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #2b2b2b;
    }

    .splash-hint {
      margin: 0;
      font-size: 0.8125rem;
      color: #6b6b6b;
    }

    @keyframes splash-bob {
      50% { transform: translateY(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-ball { animation: none; }
      #app-splash { transition: none; }
    }

    @media (prefers-color-scheme: dark) {
      #app-splash { background: #121212; }
      .splash-title { color: #f2f2f2; }
      .splash-hint { color: #a6a6a6; }
    }
  </style>
</head>
<body>
  <app-root></app-root>

  <div id="app-splash" role="status" aria-label="Loading Pokédex">
    <div class="splash-ball" aria-hidden="true"></div>
    <p class="splash-title">Pokédex</p>
    <p class="splash-hint">Waking up the Pokémon…</p>
  </div>
</body>
</html>
