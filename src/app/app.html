<ion-app>
  <ion-router-outlet />

  <!-- Mobile-only bottom nav. Pinned via CSS, not slot="bottom": that slot is
       only honoured inside <ion-tabs>, which router-based nav does not use. -->
  @if (showTabs()) {
    <ion-tab-bar class="app-tabs">
      <ion-tab-button routerLink="/pokemon" [selected]="!onFavorites()">
        <ion-icon [name]="onFavorites() ? 'list-outline' : 'list'" aria-hidden="true" />
        <ion-label>All</ion-label>
      </ion-tab-button>

      <ion-tab-button routerLink="/favorites" [selected]="onFavorites()">
        <ion-icon [name]="onFavorites() ? 'heart' : 'heart-outline'" aria-hidden="true" />
        <ion-label>Favorites</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  }
</ion-app>
