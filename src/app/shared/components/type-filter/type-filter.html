<!-- Desktop: inline multi-select chip row. -->
<div class="filter-bar" role="group" aria-label="Filter by type">
  <span class="filter-bar__label">TYPE:</span>

  @for (type of types(); track type) {
    <button
      type="button"
      class="chip"
      [class.chip--on]="isOn(type)"
      [attr.aria-pressed]="isOn(type)"
      (click)="toggle(type)"
    >
      {{ type }}
    </button>
  }

  @if (hasSelection()) {
    <button type="button" class="chip chip--clear" (click)="clear()">clear</button>
  }
</div>

<!-- Mobile: floating trigger, dot badge while filters are active. Positioned by
     our own CSS so it clears the tab bar and does not need ion-content's slot. -->
<div class="filter-fab">
  <ion-fab-button
    [attr.aria-label]="
      hasSelection()
        ? 'Filter by type, ' + selected().length + ' active'
        : 'Filter by type'
    "
    (click)="openSheet()"
  >
    <ion-icon name="funnel" aria-hidden="true" />
    @if (hasSelection()) {
      <span class="filter-fab__dot" aria-hidden="true"></span>
    }
  </ion-fab-button>
</div>

<!-- Stock Ionic modal: full screen on phones, centred card from 768px up. -->
<ion-modal [isOpen]="sheetOpen()" (ionModalDidDismiss)="closeSheet()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Filter by type</ion-title>
        <ion-buttons slot="end">
          <ion-button aria-label="Close filter" (click)="closeSheet()">
            <ion-icon slot="icon-only" name="close" aria-hidden="true" />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <!-- Anchors the chips and Apply to the bottom of the full-screen modal. -->
      <div class="sheet-body">
        <div class="sheet-grid" role="group" aria-label="Pokémon types">
        @for (type of types(); track type) {
          <button
            type="button"
            class="chip chip--block"
            [class.chip--on]="isDraftOn(type)"
            [attr.aria-pressed]="isDraftOn(type)"
            (click)="toggleDraft(type)"
          >
            {{ type }}
            </button>
          }
        </div>

        <div class="sheet-actions">
          @if (draft().length) {
            <ion-button fill="clear" (click)="clearDraft()">Clear</ion-button>
          }
          <ion-button expand="block" (click)="apply()">Apply</ion-button>
        </div>
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
